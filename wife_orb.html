<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Wife Assistant 3D Glowing Sphere</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b0a2a 0%, #05020a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .controls {
      position: relative;
      z-index: 10;
      margin-bottom: 40px;
      display: flex;
      gap: 15px;
    }
    input {
      padding: 12px 20px;
      width: 320px;
      border-radius: 25px;
      border: 1px solid #ff007f;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      outline: none;
      backdrop-filter: blur(5px);
      font-size: 15px;
    }
    button {
      padding: 12px 28px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(45deg, #00f3ff, #ff007f);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="controls">
    <input type="text" id="voiceText" placeholder="কি বলতে চাও সোনা..." value="হ্যাঁ সোনা, বলো! আমি শুনছি।">
    <button onclick="speakWife()">কথা বলো</button>
  </div>

  <script>
    let scene, camera, renderer, sphere, innerCore;
    let isSpeaking = false;

    // ১. Three.js সিন ইনিশিয়ালাইজেশন
    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 4;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // বাইরের ওয়্যারফ্রেম বল (Geodesic / Icosahedron)
      const outerGeo = new THREE.IcosahedronGeometry(1.6, 2);
      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        wireframe: true,
        transparent: true,
        opacity: 0.85
      });
      sphere = new THREE.Mesh(outerGeo, outerMat);
      scene.add(sphere);

      // ভেতরের গ্লোয়িং কোর
      const innerGeo = new THREE.IcosahedronGeometry(1.0, 3);
      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xff007f,
        wireframe: true,
        transparent: true,
        opacity: 0.6
      });
      innerCore = new THREE.Mesh(innerGeo, innerMat);
      scene.add(innerCore);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ২. রোটেশন ও পালসিং অ্যানিমেশন লুপ
    function animate() {
      requestAnimationFrame(animate);

      if (isSpeaking) {
        // কথা বলার সময় দ্রুত ঘুরবে এবং স্পন্দিত হবে
        sphere.rotation.x += 0.04;
        sphere.rotation.y += 0.05;
        innerCore.rotation.x -= 0.06;
        innerCore.rotation.y -= 0.04;

        const pulse = 1 + Math.sin(Date.now() * 0.015) * 0.12;
        sphere.scale.set(pulse, pulse, pulse);
        innerCore.material.color.setHex(0xaaff00); // কথা বলার সময় রঙ হালকা নিয়ন হবে
      } else {
        // শান্ত অবস্থায় ধীর রোটেশন
        sphere.rotation.x += 0.005;
        sphere.rotation.y += 0.008;
        innerCore.rotation.x -= 0.007;
        innerCore.rotation.y -= 0.005;

        sphere.scale.set(1, 1, 1);
        innerCore.material.color.setHex(0xff007f);
      }

      renderer.render(scene, camera);
    }

    // Android Native Interface
    function setSpeakingState(speaking) {
      isSpeaking = speaking;
    }

    // ৩. ভয়েস সিন্থেসিস ও স্টেট পরিবর্তন
    function speakWife() {
      const text = document.getElementById('voiceText').value;
      if (!text) return;

      // If Android Interface is available, use it instead of Web Speech API
      if (window.AndroidWife) {
          window.AndroidWife.speak(text);
          return;
      }

      window.speechSynthesis.cancel(); // আগের কথা বন্ধ করা

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'bn-IN';
      utterance.rate = 0.95;
      utterance.pitch = 1.2; // মিষ্টি স্ত্রী কণ্ঠের পিচ

      utterance.onstart = () => {
        isSpeaking = true;
      };

      utterance.onend = () => {
        isSpeaking = false;
      };

      utterance.onerror = () => {
        isSpeaking = false;
      };

      window.speechSynthesis.speak(utterance);
    }

    window.onload = init;
  </script>
</body>
</html>
