name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          
          # Detect the active Java major version
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          MAJOR_VERSION=$(echo "$JAVA_VERSION" | awk -F '.' '{if ($1 == 1) print $2; else print $1}')
          
          if [ -z "$MAJOR_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          
          echo "Active Java Major Version: $MAJOR_VERSION"
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version is lower than 17 ($MAJOR_VERSION)."
            exit 1
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            
            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore."
              exit 1
            fi
            echo "debug.keystore generated successfully."
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching in app/build/outputs/apk:"
            find app/build/outputs/apk -type f
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK exists but is empty."
            exit 1
          fi
          
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: File does not have .apk extension."
            exit 1
          fi
          
          echo "APK successfully verified at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME_SANITIZED=$(echo "${{ github.event.repository.name }}" | sed -e 's/[^a-zA-Z0-9-]/-/g')
          RELEASE_FILENAME="${REPO_NAME_SANITIZED}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"
          
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          echo "release_asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "release_filename=$RELEASE_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare-asset.outputs.release_asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset not found at $ASSET_PATH"
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is empty."
            exit 1
          fi
          
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset does not have .apk extension."
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES="* This is an automatically generated debug APK.
          * The APK was built by GitHub Actions.
          * The GitHub Actions run number: ${{ github.run_number }}
          * The GitHub Actions run attempt: ${{ github.run_attempt }}
          * The source commit SHA: ${{ github.sha }}
          * The APK is intended for testing.
          * The APK is not a Play Store production release.
          * The APK is signed only with a temporary debug keystore."
          
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish-release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            TITLE="Debug APK Build #${{ github.run_number }}"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            FILENAME="${{ steps.prepare-asset.outputs.release_filename }}"
            
            echo "Release successful!"
            gh release view "$TAG"
            
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $FILENAME"
            
            echo "### 🚀 APK Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "[View Release Page]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "Asset Filename: \`$FILENAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** The normal Actions artifact (\`app-debug-apk\`) is also available as a backup on the workflow run page." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: Release publishing failed."
            echo "However, the APK build succeeded and the artifact 'app-debug-apk' was uploaded successfully."
            
            echo "### ⚠️ Release Publishing Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, but the GitHub Release could not be created." >> $GITHUB_STEP_SUMMARY
            echo "The APK is still available for download as a normal Actions artifact named \`app-debug-apk\` on this workflow run page." >> $GITHUB_STEP_SUMMARY
          fi
