<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Wife Assistant 3D Glowing Sphere</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b0a2a 0%, #05020a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .controls {
      position: relative;
      z-index: 10;
      margin-bottom: 40px;
      display: flex;
      gap: 15px;
    }
    input {
      padding: 12px 20px;
      width: 320px;
      border-radius: 25px;
      border: 1px solid #ff007f;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      outline: none;
      backdrop-filter: blur(5px);
      font-size: 15px;
    }
    button {
      padding: 12px 28px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(45deg, #00f3ff, #ff007f);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
    }
  </style>
  <script src="three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="controls">
    <input type="text" id="voiceText" placeholder="কি বলতে চাও সোনা..." value="হ্যাঁ সোনা, বলো! আমি শুনছি।">
    <button onclick="speakWifeMultiLanguage()">কথা বলো</button>
  </div>

  <script>
    let scene, camera, renderer, sphere, innerCore;
    let isSpeaking = false;
    let isAngry = false;

    // ১. Three.js সিন ইনিশিয়ালাইজেশন
    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 4;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // বাইরের ওয়্যারফ্রেম বল (Geodesic / Icosahedron)
      const outerGeo = new THREE.IcosahedronGeometry(1.6, 2);
      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        wireframe: true,
        transparent: true,
        opacity: 0.85
      });
      sphere = new THREE.Mesh(outerGeo, outerMat);
      scene.add(sphere);

      // ভেতরের গ্লোয়িং কোর
      const innerGeo = new THREE.IcosahedronGeometry(1.0, 3);
      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xff007f,
        wireframe: true,
        transparent: true,
        opacity: 0.6
      });
      innerCore = new THREE.Mesh(innerGeo, innerMat);
      scene.add(innerCore);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ২. রোটেশন ও পালসিং অ্যানিমেশন লুপ
    function animate() {
      requestAnimationFrame(animate);

      if (isAngry) {
        // রেগে গেলে দ্রুত কাঁপবে (shake) এবং লাল হয়ে যাবে
        sphere.rotation.x += 0.1;
        sphere.rotation.y += 0.1;
        innerCore.rotation.x -= 0.15;
        innerCore.rotation.y -= 0.1;

        const shakeX = (Math.random() - 0.5) * 0.2;
        const shakeY = (Math.random() - 0.5) * 0.2;
        sphere.position.set(shakeX, shakeY, 0);

        const pulse = 1 + Math.sin(Date.now() * 0.05) * 0.15;
        sphere.scale.set(pulse, pulse, pulse);
        
        sphere.material.color.setHex(0xff0000); // লাল রং
        innerCore.material.color.setHex(0xff0000);
      } else if (isSpeaking) {
        // কথা বলার সময় দ্রুত ঘুরবে এবং স্পন্দিত হবে
        sphere.position.set(0, 0, 0);
        sphere.rotation.x += 0.04;
        sphere.rotation.y += 0.05;
        innerCore.rotation.x -= 0.06;
        innerCore.rotation.y -= 0.04;

        const pulse = 1 + Math.sin(Date.now() * 0.015) * 0.12;
        sphere.scale.set(pulse, pulse, pulse);
        sphere.material.color.setHex(0x00f3ff);
        innerCore.material.color.setHex(0xaaff00); // কথা বলার সময় রঙ হালকা নিয়ন হবে
      } else {
        // শান্ত অবস্থায় ধীর রোটেশন
        sphere.position.set(0, 0, 0);
        sphere.rotation.x += 0.005;
        sphere.rotation.y += 0.008;
        innerCore.rotation.x -= 0.007;
        innerCore.rotation.y -= 0.005;

        sphere.scale.set(1, 1, 1);
        sphere.material.color.setHex(0x00f3ff);
        innerCore.material.color.setHex(0xff007f);
      }

      renderer.render(scene, camera);
    }

    // Android Native Interface
    function setSpeakingState(speaking) {
      isSpeaking = speaking;
    }
    
    function setAngryState(angry) {
      isAngry = angry;
    }

    // ৩. ভয়েস সিন্থেসিস ও স্টেট পরিবর্তন (মাল্টি ল্যাঙ্গুয়েজ)
    function speakWifeMultiLanguage() {
      const text = document.getElementById('voiceText').value.trim();
      if (!text) return;

      // If Android Interface is available, use it instead of Web Speech API
      if (window.AndroidWife) {
          window.AndroidWife.speak(text);
          return;
      }

      window.speechSynthesis.cancel(); // আগের কথা বন্ধ করা

      const utterance = new SpeechSynthesisUtterance(text);

      // ১. স্ক্রিপ্ট/ভাষার কোড শনাক্তকরণ
      const isBengali = /[\u0980-\u09FF]/.test(text);
      const isHindi = /[\u0900-\u097F]/.test(text);
      const isArabic = /[\u0600-\u06FF]/.test(text);
      const isTamil = /[\u0B80-\u0BFF]/.test(text);
      const isTelugu = /[\u0C00-\u0C7F]/.test(text);
      const isSantali = /[\u1C50-\u1C7F]/.test(text) || text.toLowerCase().includes("santali"); 

      if (isBengali) {
        utterance.lang = 'bn-IN';
      } else if (isHindi) {
        utterance.lang = 'hi-IN';
      } else if (isArabic) {
        utterance.lang = 'ar-SA';
      } else if (isTamil) {
        utterance.lang = 'ta-IN';
      } else if (isTelugu) {
        utterance.lang = 'te-IN';
      } else if (isSantali) {
        utterance.lang = 'sat-IN';
      } else {
        utterance.lang = 'en-US';
      }

      // ২. ডিভাইসে বিদ্যমান সেরা নারী কণ্ঠ নির্বাচন
      const voices = window.speechSynthesis.getVoices();
      let matchedVoice = voices.find(v => v.lang.startsWith(utterance.lang.slice(0, 2)) && /female|woman|zira|aditi|girl|samantha/i.test(v.name));
      if (!matchedVoice) {
         // Fallback to first available voice in the language
         matchedVoice = voices.find(v => v.lang.startsWith(utterance.lang.slice(0, 2)));
      }

      if (matchedVoice) {
        utterance.voice = matchedVoice;
      }

      utterance.pitch = 1.2; // মিষ্টি স্ত্রী কণ্ঠের পিচ
      utterance.rate = 0.95;

      utterance.onstart = () => {
        isSpeaking = true;
      };

      utterance.onend = () => {
        isSpeaking = false;
      };

      utterance.onerror = () => {
        isSpeaking = false;
      };

      window.speechSynthesis.speak(utterance);
    }

    // সিস্টেমের ভয়েস লিস্ট লোড নিশ্চিত করা
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };

    window.onload = init;
  </script>
</body>
</html>
